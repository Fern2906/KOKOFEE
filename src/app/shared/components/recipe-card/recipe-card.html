<nb-card nbSurface clip tone="pink" border="strong" shadow="hard" radius="xl"
  class="recipe-card relative flex flex-col h-full max-w-[420px] transition-all duration-200 hover:-translate-y-1">
  <nb-sticker shape="star" tone="mint" [rotate]="10" class="absolute -top-5 -right-3 z-20"
    [attr.aria-label]="'Dificultad: ' + recipe().difficulty">
    <nb-sticker-face>
      <span nbText size="xs" weight="black" transform="uppercase">
        {{ recipe().difficulty }}
      </span>
    </nb-sticker-face>
  </nb-sticker>

  <nb-card-header
    class="recipe-card__header flex items-center justify-between gap-2 px-4 py-3 border-b-4 border-black]">
    <span nbChip tone="warning" radius="md">
      <span nbStatusDot state="online"></span>
      {{ recipe().method }}
    </span>

    <span nbChip tone="ink" radius="md">
      {{ recipe().timeDisplay }}
    </span>
  </nb-card-header>

  <div class="p-4 pb-0">
    <div nbMediaFrame ratio="16/9" tone="pink" border="strong" radius="lg" shadow="none">
      <img [src]="recipe().imageUrl" [alt]="'Foto de ' + recipe().title" class="w-full h-full object-cover"
        loading="lazy" />
    </div>
  </div>

  <nb-card-content class="flex-1 flex flex-col gap-4 p-4">

    <div nbStack gap="xs" align="start">
      <span nbChip size="xl" tone="accent">
        {{ recipe().title }}
      </span>
    </div>

    <p nbText size="sm" weight="medium" class="line-clamp-3 m-0">
      {{ recipe().description }}
    </p>
  </nb-card-content>

  <nb-card-footer class="mt-auto flex items-center justify-between gap-3 px-4 py-3 border-t-4 border-black">
    <span nbChip tone="cream" radius="md" class="font-mono font-bold text-xs">
      {{ recipe().stepsCount }} pasos
    </span>
    <button nbButton tone="yellow" size="md" radius="md" (click)="viewRecipe.emit(recipe())">
      <span nbText size="md" weight="black" transform="uppercase" tracking="wide">
        Ver Receta
      </span>
      <span nbButtonTrailingIcon shape="circle" tone="inverse" size="sm" icon="/open-to-work/arrow-icon.svg"></span>
    </button>
  </nb-card-footer>
</nb-card>
