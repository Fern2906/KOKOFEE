<nb-card nbSurface clip tone="warning" border="strong" shadow="hard" radius="xl" class="flex flex-col h-full transition-all duration-200 hover:-translate-y-1">
      <div class="relative overflow-hidden m-1">
        <div nbMediaFrame ratio="16/9">
          <img
            [src]="recipe().imageUrl"
            class="w-full max-w-sm"
            loading="lazy"
          />
        </div>
      </div>

      <nb-card-content class="p-4 pt-0 flex-1 flex flex-col justify-between">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display text-lg font-bold text-koko-espresso group-hover:text-koko-caramel transition-colors">
            {{ recipe().title }}
          </h3>
          <span nbBadge tone="primary" size="md" class="font-bold text-xs">
            {{ recipe().difficulty }}
          </span>
        </div>

        <div class="flex items-center justify-between mb-4">
          <span nbBadge tone="secondary" class="font-bold text-xs">
            ☕ {{ recipe().method }}
          </span>
          <span nbBadge tone="cream" class="font-medium text-xs">
            ⏱ {{ recipe().timeDisplay }}
          </span>
        </div>

        <p class="text-xs text-koko-coffee/80 line-clamp-2 mb-3">
          {{ recipe().description }}
        </p>

        <!-- Brewing Recipe Specs -->
        <div class="grid grid-cols-2 gap-2 p-2.5 bg-koko-cream/60 rounded-md border border-koko-border-subtle text-xs mb-3 font-mono">
          <div>
            <span class="text-[10px] text-koko-muted block uppercase">Ratio</span>
            <span class="font-semibold text-koko-espresso">{{ recipe().ratio }}</span>
          </div>
          <div>
            <span class="text-[10px] text-koko-muted block uppercase">Molienda</span>
            <span class="font-semibold text-koko-espresso">{{ recipe().grindSize }}</span>
          </div>
        </div>

        <div class="text-[11px] text-koko-muted">
          <span class="font-semibold text-koko-espresso">Grano recomendado:</span> {{ recipe().recommendedCoffee }}
        </div>
      </nb-card-content>

      <nb-card-footer class="p-4 pt-3 border-t-2 border-koko-espresso/10 bg-koko-cream/30 flex items-center justify-between mt-auto">
        <span class="text-xs text-koko-muted font-mono">
          {{ recipe().stepsCount }} pasos detallados
        </span>

        <button
          nbButton
          tone="secondary"
          size="sm"
          (click)="viewRecipe.emit(recipe())"
          class="font-bold flex items-center gap-1.5"
        >
          <span>Ver Receta</span>
          <span class="text-xs">→</span>
        </button>
      </nb-card-footer>
    </nb-card>
