<div nbSurface clip tone="white" border="strong" shadow="hard" radius="xl" class="relative flex flex-col h-full">

  <div class="relative">
    <nb-sticker
      tone="yellow"
      [rotate]="-15"
      [attr.aria-label]="'Precio: ' + product().price"
      size="0.8"
      class="absolute -top-12 -left-15 z-50"
    >
      <span class="font-mono font-black text-black text-sm">
        ${{ product().price.toFixed(2) }}
      </span>
    </nb-sticker>

    <div nbMediaFrame ratio="4/3" radius="none" shadow="none" border="strong">
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="w-full h-full object-cover"
        loading="lazy"
      />
    </div>
  </div>

  <div nbSplit ratio="1:1" gap="md" padding="md" collapse="md" separator="none">
    <div nbStack gap="lg">

      <h3 nbDisplay size="sm"  class="uppercase font-black leading-tight">
        {{ product().name }}
      </h3>

      <p nbText size="xs" underline="bar" underlineGap="xs" weight="medium" tone="muted" class="inline-flex flex-col items-start" >
        {{ product().description }}
      </p>
    </div>
  </div>

  <div nbSection divider="top" padding="md" class="mt-5 mb-5">
    <div nbStack gap="xs">
      <div nbChipGroup gap="sm" radius="sm">
        @for (note of product().tastingNotes; track note) {
          <span nbChip tone="pink" class="text-xs font-bold">
            {{ note }}
          </span>
        }
      </div>
    </div>
  </div>

  <div nbSection divider="top" padding="md" class="mt-auto">
    <button
      nbButton
      [tone]="added() ? 'mint' : 'lavender'"
      size="lg"
      radius="md"
      class="w-full"
      (click)="handleAddToCart($event)"
      [attr.aria-label]="'Añadir ' + product().name + ' al carrito'"
    >
      @if (added()) {
        <lucide-icon [img]="icons.check" strokeWidth="3" class="w-5 h-5"></lucide-icon>
        <span nbText size="md" weight="black" transform="uppercase">Añadido</span>
      } @else {
        <lucide-icon [img]="icons.cart" strokeWidth="3" class="w-5 h-5"></lucide-icon>
        <span nbText size="md" weight="black" transform="uppercase">Agregar al carrito</span>
      }
    </button>
  </div>

</div>
